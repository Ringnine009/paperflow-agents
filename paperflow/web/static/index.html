<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperFlow · Multi-Agent Paper Review</title>
<style>
  :root {
    --bg: #0a0a0b; --panel: #121214; --panel2: #18181b; --border: #27272a;
    --text: #e4e4e7; --muted: #a1a1aa; --accent: #6c8cff; --ok: #4ade80;
    --warn: #fbbf24; --err: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.55 "Inter", "Segoe UI", system-ui, sans-serif; }
  header { padding: 20px 28px; border-bottom: 1px solid var(--border);
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: -0.02em; }
  header span { color: var(--muted); font-size: 12px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 28px 60px; }
  .entry-row { display: flex; gap: 10px; }
  input[type=text] { flex: 1; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  input[type=text]:focus { outline: 1px solid var(--accent); }
  button { background: var(--accent); color: #0a0a0b; font-weight: 600;
    border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 2px 0; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; margin-top: 24px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border);
           border-radius: 12px; padding: 16px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
              color: var(--muted); margin: 0 0 12px; }
  .run { border: 1px solid var(--border); border-radius: 8px; padding: 10px;
         margin-bottom: 8px; cursor: pointer; background: var(--panel2); }
  .run:hover { border-color: var(--accent); }
  .run .id { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px;
             color: var(--muted); }
  .run .title { margin: 4px 0; font-size: 13px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px;
           border: 1px solid var(--border); color: var(--muted); }
  .badge.done { color: var(--ok); border-color: var(--ok); }
  .badge.failed { color: var(--err); border-color: var(--err); }
  .badge.running { color: var(--warn); border-color: var(--warn); }
  .agents { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .agent-chip { font-size: 11px; padding: 3px 10px; border-radius: 99px;
                border: 1px solid var(--border); color: var(--muted); }
  .agent-chip.running { color: var(--warn); border-color: var(--warn); }
  .agent-chip.done { color: var(--ok); border-color: var(--ok); }
  .agent-chip.failed { color: var(--err); border-color: var(--err); }
  .agent-chip.pending { opacity: 0.55; }
  .log { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px;
         color: var(--muted); max-height: 180px; overflow: auto; }
  .log div { padding: 2px 0; border-bottom: 1px solid #1d1d20; }
  .report { white-space: pre-wrap; font-size: 13px; }
  .report h1, .report h2 { color: var(--text); }
  .report a { color: var(--accent); }
  .report strong { color: var(--text); }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; }
  #report-view { display: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { background: transparent; color: var(--muted); border: 1px solid var(--border);
                 font-weight: 500; }
  .tabs button.active { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>PaperFlow</h1>
  <span>multi-agent paper review — Researcher · Reader · Critic · Synthesizer</span>
</header>
<main>
  <div class="entry-row">
    <input id="entry" type="text" placeholder="arXiv URL, DOI (10.xxxx/...), or local PDF path …">
    <button id="start">Review paper</button>
  </div>
  <div class="hint">e.g. https://arxiv.org/abs/1706.03762 · 10.54254/2753-8818/2026.DL34010 · C:\papers\paper.pdf</div>

  <div class="grid">
    <div class="panel">
      <h2>Runs</h2>
      <div id="runs"><div class="empty">No runs yet — start one above.</div></div>
    </div>

    <div class="panel" id="detail-view">
      <h2 id="detail-title">Select a run</h2>
      <div id="detail-body"><div class="empty">The task board and final report will appear here.</div></div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let current = null, pollTimer = null;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* tiny safe markdown renderer (headings, bold, italic, links, code, lists, quotes) */
function md(src) {
  const lines = esc(src).split("\n");
  let html = "", inCode = false, inList = false;
  const inline = (t) => t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.trim().startsWith("```")) { inCode = !inCode; html += inCode ? "<pre><code>" : "</code></pre>\n"; continue; }
    if (inCode) { html += line + "\n"; continue; }
    const m = line.match(/^(#{1,3})\s+(.*)$/);
    if (m) { const lvl = m[1].length; html += `<h${lvl}>${inline(m[2])}</h${lvl}>`; continue; }
    if (line.startsWith("> ")) { html += `<blockquote>${inline(line.slice(2))}</blockquote>`; continue; }
    if (/^\s*[-*]\s+/.test(line)) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(line.replace(/^\s*[-*]\s+/, ""))}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (line.trim() === "") { html += "\n"; continue; }
    html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

function statusBadge(s) { return `<span class="badge ${s}">${s}</span>`; }

function renderRuns(runs) {
  const box = $("runs");
  if (!runs.length) { box.innerHTML = '<div class="empty">No runs yet.</div>'; return; }
  box.innerHTML = runs.map(r => `
    <div class="run" data-id="${r.id}" onclick="selectRun('${r.id}')">
      <div class="id">${r.id} · ${r.input.kind}</div>
      <div class="title">${esc(r.input.raw.length > 70 ? r.input.raw.slice(0,70)+"…" : r.input.raw)}</div>
      ${statusBadge(r.status)}
    </div>`).join("");
}

function renderDetail(board) {
  $("detail-title").textContent = board.id;
  const agents = ["researcher", "reader", "critic", "synthesizer"];
  const chips = agents.map(a => {
    const st = (board.agents[a] || {}).status || "pending";
    return `<span class="agent-chip ${st}">${a}: ${st}</span>`;
  }).join("");
  const log = board.log.slice(-30).map(e =>
    `<div>[${e.ts.slice(11,19)}] ${e.agent ? e.agent+": " : ""}${esc(e.message)}</div>`).join("");
  $("detail-body").innerHTML = `
    <div>input: <code>${esc(board.input.raw)}</code> &nbsp; ${statusBadge(board.status)}</div>
    <div class="agents">${chips}</div>
    <div class="tabs">
      <button id="tab-board" class="active" onclick="showTab('board')">Task board</button>
      <button id="tab-report" onclick="showTab('report')">Report</button>
    </div>
    <div id="board-view"><h2>Activity log</h2><div class="log">${log || '<div class="empty">no events yet</div>'}</div></div>
    <div id="report-view"><div class="report"></div></div>`;
  if (board.report) loadReport(board.id);
  if (board.status === "running") startPolling(); else stopPolling();
}

function showTab(which) {
  $("tab-board").classList.toggle("active", which === "board");
  $("tab-report").classList.toggle("active", which === "report");
  $("board-view").style.display = which === "board" ? "" : "none";
  $("report-view").style.display = which === "report" ? "" : "none";
}

async function loadReport(id) {
  try {
    const res = await fetch(`/api/runs/${id}/report`);
    const text = await res.text();
    $("report-view").querySelector(".report").innerHTML = md(text);
  } catch { /* report not ready yet */ }
}

async function refresh() {
  const { runs } = await api("/api/boards");
  renderRuns(runs);
  if (current && runs.some(r => r.id === current)) {
    const board = await api(`/api/runs/${current}`);
    renderDetail(board);
  }
}

function startPolling() { if (!pollTimer) pollTimer = setInterval(refresh, 2000); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

async function selectRun(id) { current = id; refresh(); }
window.selectRun = selectRun;
window.showTab = showTab;

$("start").addEventListener("click", async () => {
  const entry = $("entry").value.trim();
  if (!entry) return;
  $("start").disabled = true;
  try {
    const { run_id } = await api("/api/runs", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ entry }),
    });
    $("entry").value = "";
    current = run_id;
    await refresh();
    startPolling();
  } catch (e) { alert("start failed: " + e.message); }
  finally { $("start").disabled = false; }
});

$("entry").addEventListener("keydown", (e) => { if (e.key === "Enter") $("start").click(); });

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
